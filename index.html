<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>정보처리기사 실기 이론 160제 플래시카드</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-sub: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #4f46e5;
      --primary-soft: #eef2ff;
      --accent: #f59e0b;
      --success: #10b981;
      --border: #e2e8f0;
      --card-front: #ffffff;
      --card-back: #1e1b4b;
      --card-back-text: #f8fafc;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-sub: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-soft: rgba(99, 102, 241, 0.15);
      --border: #334155;
      --card-front: #1e293b;
      --card-back: #312e81;
      --card-back-text: #ffffff;
      --shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      transition: background-color 0.2s, color 0.2s;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 12px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .title-area h1 {
      font-size: 1.15rem;
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .title-area p {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin: 2px 0 0 0;
    }

    .top-actions {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .icon-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .search-bar {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .category-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex-shrink: 0;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--surface-sub);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.25s ease;
    }

    .card-stage {
      perspective: 1200px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 290px;
      max-height: 420px;
      margin: 4px 0;
      user-select: none;
    }

    .flashcard {
      width: 100%;
      height: 100%;
      min-height: 280px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }

    .flashcard.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 20px;
      padding: 22px 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-front {
      background: var(--card-front);
      color: var(--text);
    }

    .card-back {
      background: var(--card-back);
      color: var(--card-back-text);
      transform: rotateY(180deg);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 700;
      gap: 6px;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .card-back .badge {
      background: rgba(255, 255, 255, 0.15);
      color: #e0e7ff;
    }

    .exam-badge {
      font-size: 0.73rem;
      background: #fef3c7;
      color: #d97706;
      border: 1px solid #f59e0b;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 800;
    }

    [data-theme="dark"] .exam-badge {
      background: rgba(245, 158, 11, 0.2);
      color: #fcd34d;
    }

    .tip-tag {
      font-size: 0.73rem;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      display: inline-block;
    }

    .card-content {
      margin: auto 0;
      text-align: center;
      font-size: 1.12rem;
      line-height: 1.55;
      font-weight: 700;
      word-break: keep-all;
      overflow-y: auto;
      max-height: 180px;
      padding: 4px;
    }

    .card-back .card-content {
      font-size: 1.2rem;
      color: #fde68a;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      opacity: 0.7;
    }

    .practice-box {
      display: none;
      gap: 8px;
      margin-top: 4px;
    }

    .practice-box.show {
      display: flex;
    }

    .practice-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.92rem;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    .btn {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s, background-color 0.15s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .btn-star.active {
      background: rgba(245, 158, 11, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-done.active {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }

    .list-view {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
      padding-bottom: 24px;
    }

    .list-view.show {
      display: flex;
    }

    .list-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .list-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .list-item-q {
      font-weight: 700;
      font-size: 0.92rem;
    }

    .list-item-a {
      font-size: 0.88rem;
      color: var(--primary);
      font-weight: 700;
      background: var(--primary-soft);
      padding: 6px 10px;
      border-radius: 8px;
    }

    .list-item-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      margin-top: 2px;
    }

    .mini-btn {
      background: var(--surface-sub);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.73rem;
      font-weight: 600;
      cursor: pointer;
    }

    .mini-btn.active-star {
      background: rgba(245, 158, 11, 0.2);
      color: var(--accent);
      border-color: var(--accent);
    }

    .mini-btn.active-done {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
      border-color: var(--success);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-area">
        <h1>🥔 정처기 실기 이론 160제</h1>
        <p id="statsText">암기 완료 0 / 160 · ⭐ 북마크 0</p>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="tipToggleBtn" title="암기 팁 켜기/끄기">💡 팁 꺼짐</button>
        <button class="icon-btn" id="shuffleBtn" title="랜덤 섞기">🔀 셔플</button>
        <button class="icon-btn" id="viewModeBtn" title="전체 목록 보기">📋 목록</button>
        <button class="icon-btn" id="resetBtn" title="학습 기록 초기화">🔄 초기화</button>
        <button class="icon-btn" id="themeBtn" title="다크 모드 전환">🌙</button>
      </div>
    </header>

    <div class="search-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="키워드 검색 (예: OSI, 서브넷팅, 응집도, 회복, 디자인패턴...)" />
      <button class="icon-btn" id="hideDoneBtn" title="암기 완료 카드 숨기기">✅제외</button>
    </div>

    <div class="category-tabs" id="categoryTabs">
      <button class="tab-btn active" data-cat="ALL">전체 (160)</button>
      <button class="tab-btn" data-cat="STAR">⭐ 오답/북마크</button>
      <button class="tab-btn" data-cat="1. DB">1. DB (35)</button>
      <button class="tab-btn" data-cat="2. 네트워크/OS">2. 네트워크/OS (40)</button>
      <button class="tab-btn" data-cat="3. SW 개발">3. SW 개발 (25)</button>
      <button class="tab-btn" data-cat="4. SW 설계">4. SW 설계 (30)</button>
      <button class="tab-btn" data-cat="5. 보안/신기술">5. 보안/신기술 (30)</button>
    </div>

    <div class="status-row">
      <span id="counterText">1 / 160</span>
      <button class="icon-btn" id="typingToggleBtn" style="padding: 4px 8px; font-size: 0.75rem;">⌨️ 직접 입력 모드</button>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- 1-by-1 Card Mode -->
    <div id="cardModeArea" style="display: flex; flex-direction: column; flex: 1; gap: 10px;">
      <div class="card-stage" id="cardStage">
        <div class="flashcard" id="flashcard">
          <div class="card-face card-front">
            <div class="card-header">
              <div class="badge-group">
                <span class="badge" id="frontCat">1. DB</span>
                <span class="exam-badge" id="frontExam" style="display:none;">🔥 2024년 2회 기출</span>
                <span class="tip-tag" id="frontTip">💡 두문자 팁</span>
              </div>
              <span id="frontId">#001</span>
            </div>
            <div class="card-content" id="frontQuestion">질문이 표시됩니다.</div>
            <div class="card-footer">
              <span>👆 터치하여 정답 확인</span>
              <span id="frontStatus"></span>
            </div>
          </div>
          <div class="card-face card-back">
            <div class="card-header">
              <span class="badge" id="backCat">정답 (Answer)</span>
              <span id="backId">#001</span>
            </div>
            <div class="card-content" id="backAnswer">정답이 표시됩니다.</div>
            <div class="card-footer">
              <span>👆 다시 터치하면 문제로</span>
              <span>좌우 스와이프로 이동</span>
            </div>
          </div>
        </div>
      </div>

      <div class="practice-box" id="practiceBox">
        <input type="text" id="practiceInput" class="practice-input" placeholder="정답 용어를 입력 후 Enter를 누르세요" />
        <button class="btn btn-primary" id="checkAnswerBtn" style="padding: 10px 16px;">정답 확인</button>
      </div>

      <div class="controls-grid">
        <button class="btn btn-star" id="starBtn">⭐ 헷갈림 (북마크)</button>
        <button class="btn btn-done" id="doneBtn">✅ 외웠음 (완료)</button>
      </div>

      <div class="nav-grid">
        <button class="btn" id="prevBtn">◀ 이전</button>
        <button class="btn btn-primary" id="flipBtn">🔄 카드 뒤집기</button>
        <button class="btn" id="nextBtn">다음 ▶</button>
      </div>
    </div>

    <!-- List View Mode -->
    <div class="list-view" id="listViewArea"></div>
  </div>

  <script>
    const CARDS_DATA = [
      // --- 1과목: 데이터베이스 (DB) (001~035) ---
      { id: 1, cat: "1. DB", q: "사용자나 개발자 관점에서 본 데이터베이스 구조(사용자 뷰, 서브스키마)는?", a: "외부 스키마", tip: "외부=사용자뷰", exam: "2023년 1회 기출" },
      { id: 2, cat: "1. DB", q: "조직 전체적인 뷰로서 개체 간 관계, 제약 조건, 접근 권한, 보안 및 무결성을 정의한 스키마는?", a: "개념 스키마", tip: "개념=전체뷰", exam: "2023년 1회 기출" },
      { id: 3, cat: "1. DB", q: "물리적 저장장치 관점에서 실제로 저장될 레코드 형식을 정의한 스키마는?", a: "내부 스키마", tip: "내부=물리저장", exam: "2023년 1회 기출" },
      { id: 4, cat: "1. DB", q: "특정 시점의 릴레이션에 들어있는 실제 데이터 집합(= 릴레이션 외연)은?", a: "릴레이션 인스턴스 (Relation Instance)", tip: "인스턴스=외연", exam: "2023년 1회 기출" },
      { id: 5, cat: "1. DB", q: "테이블의 세로 항목(컬럼)과 가로 항목(행)을 관계 데이터 모델에서 각각 무엇이라 하는가?", a: "열 = 속성(Attribute) / 행 = 튜플(Tuple)", tip: "열속행튜", exam: "2024년 2회 기출" },
      { id: 6, cat: "1. DB", q: "릴레이션에서 '속성(열)의 수'와 '튜플(행)의 수'를 각각 뜻하는 용어는?", a: "속성 수 = 차수(Degree) / 튜플 수 = 카디널리티(Cardinality)", tip: "차수=속성, 카디=튜플", exam: "2024년 2회 기출" },
      { id: 7, cat: "1. DB", q: "데이터 모델이 갖추어야 할 3가지 구성요소는?", a: "구조(타입·관계), 연산(데이터 처리), 제약조건(무결성 유지)", tip: "구연제", exam: "2025년 1회 기출" },
      { id: 8, cat: "1. DB", q: "데이터베이스 설계 4단계와 구축을 포함한 5단계 진행 순서는?", a: "요구조건 분석 → 개념적 설계(E-R) → 논리적 설계(정규화) → 물리적 설계 → 구현", tip: "요개논물+구현", exam: "2024년 1회 기출" },
      { id: 9, cat: "1. DB", q: "E-R 다이어그램에서 사각형(▭), 마름모(◇), 타원(○), 이중 타원, 밑줄 타원이 각각 의미하는 것은?", a: "사각형(개체), 마름모(관계), 타원(속성), 이중 타원(다중값속성), 밑줄 타원(기본키)", tip: "사개마관타속", exam: "2025년 1회 기출" },
      { id: 10, cat: "1. DB", q: "E-R 다이어그램에서 '개체 집합과 관계 집합'을 연결하는 선과 '관계 집합의 속성'을 연결하는 선은?", a: "개체↔관계 = 실선(──) / 관계 속성 = 점선(┄┄)", tip: "개관실 속점", exam: "2025년 1회 기출" },
      { id: 11, cat: "1. DB", q: "트랜잭션의 연산이 모두 실행되거나 하나도 실행되지 않아야 한다는 특성(All or Nothing)은?", a: "원자성 (Atomicity)", tip: "원자성=모 아니면 도", exam: "2024년 3회 기출" },
      { id: 12, cat: "1. DB", q: "트랜잭션의 ACID 특성 중 원자성을 제외한 나머지 3가지 특성은?", a: "일관성(Consistency), 고립성(Isolation), 지속성(Durability)", tip: "일고지", exam: "2024년 3회 기출" },

      { id: 152, cat: "5. 보안/신기술", q: "KISA가 운영하는 정보보호 관리체계 약어와 개인정보 통합 관리체계 명칭은?", a: "ISMS / ISMS-P", tip: "ISMS / ISMS-P", exam: "2023년 3회 기출" },

      { id: 157, cat: "5. 보안/신기술", q: "가상 모델과 동기화하여 시뮬레이션·예측하는 기술과 3차원 가상 세계 아바타 활동 공간은?", a: "디지털 트윈 (Digital Twin) / 메타버스", tip: "디지털트윈, 메타버스", exam: "2025년 3회 기출" },

      { id: 160, cat: "5. 보안/신기술", q: "BLE 기반 70m 통신, 위치 인식 및 모바일 결제에 쓰이는 신기술은?", a: "비컨 (Beacon)", tip: "비컨=BLE위치", exam: "2025년 3회 기출" }
    ];

    // 상태 관리 (localStorage 연동)
    let starredIds = JSON.parse(localStorage.getItem("eip_starred_160") || "[]");
    let doneIds = JSON.parse(localStorage.getItem("eip_done_160") || "[]");
    let showTip = localStorage.getItem("eip_show_tip") === "true"; // 기본값 false (꺼짐)
    let currentCat = "ALL";
    let hideDone = false;
    let isShuffled = false;
    let isListView = false;
    let filteredCards = [...CARDS_DATA];
    let currentIndex = 0;

    // DOM 요소
    const flashcard = document.getElementById("flashcard");
    const frontCat = document.getElementById("frontCat");
    const frontExam = document.getElementById("frontExam");
    const frontTip = document.getElementById("frontTip");
    const frontId = document.getElementById("frontId");
    const backId = document.getElementById("backId");
    const frontQuestion = document.getElementById("frontQuestion");
    const backAnswer = document.getElementById("backAnswer");
    const frontStatus = document.getElementById("frontStatus");
    const counterText = document.getElementById("counterText");
    const statsText = document.getElementById("statsText");
    const progressFill = document.getElementById("progressFill");
    const starBtn = document.getElementById("starBtn");
    const doneBtn = document.getElementById("doneBtn");
    const searchInput = document.getElementById("searchInput");
    const hideDoneBtn = document.getElementById("hideDoneBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const viewModeBtn = document.getElementById("viewModeBtn");
    const tipToggleBtn = document.getElementById("tipToggleBtn");
    const resetBtn = document.getElementById("resetBtn");
    const cardModeArea = document.getElementById("cardModeArea");
    const listViewArea = document.getElementById("listViewArea");
    const practiceBox = document.getElementById("practiceBox");
    const practiceInput = document.getElementById("practiceInput");

    function updateTipButtonUI() {
      tipToggleBtn.textContent = showTip ? "💡 팁 켜짐" : "💡 팁 꺼짐";
      tipToggleBtn.classList.toggle("active", showTip);
    }
    updateTipButtonUI();

    function saveState() {
      localStorage.setItem("eip_starred_160", JSON.stringify(starredIds));
      localStorage.setItem("eip_done_160", JSON.stringify(doneIds));
      localStorage.setItem("eip_show_tip", showTip);
      statsText.textContent = `암기 완료 ${doneIds.length} / 160 · ⭐ 북마크 ${starredIds.length}`;
    }

    function applyFilter(resetIdx = true) {
      const keyword = searchInput.value.trim().toLowerCase();
      let list = CARDS_DATA.filter(card => {
        if (currentCat === "STAR" && !starredIds.includes(card.id)) return false;
        if (currentCat !== "ALL" && currentCat !== "STAR" && card.cat !== currentCat) return false;
        if (hideDone && doneIds.includes(card.id)) return false;
        if (keyword && !card.q.toLowerCase().includes(keyword) && !card.a.toLowerCase().includes(keyword)) return false;
        return true;
      });

      if (isShuffled) {
        list = [...list];
        for (let i = list.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [list[i], list[j]] = [list[j], list[i]];
        }
      }

      filteredCards = list;
      if (resetIdx || currentIndex >= filteredCards.length) {
        currentIndex = 0;
      }
      render();
    }

    function render() {
      saveState();
      flashcard.classList.remove("is-flipped");

      if (filteredCards.length === 0) {
        frontCat.textContent = "알림";
        frontExam.style.display = "none";
        frontTip.style.display = "none";
        frontId.textContent = "-";
        frontQuestion.textContent = "조건에 맞는 카드가 없습니다.";
        backAnswer.textContent = "-";
        counterText.textContent = "0 / 0";
        progressFill.style.width = "0%";
        starBtn.classList.remove("active");
        doneBtn.classList.remove("active");
        listViewArea.innerHTML = `<div class="empty-state">조건에 해당하는 카드가 없습니다.</div>`;
        return;
      }

      const card = filteredCards[currentIndex];
      const padId = "#" + String(card.id).padStart(3, "0");
      frontCat.textContent = card.cat;
      
      // 기출 회차 뱃지 표시
      if (card.exam) {
        frontExam.textContent = "🔥 " + card.exam;
        frontExam.style.display = "inline-block";
      } else {
        frontExam.style.display = "none";
      }

      // 팁 표시 여부 적용
      if (showTip && card.tip) {
        frontTip.textContent = "💡 " + card.tip;
        frontTip.style.display = "inline-block";
      } else {
        frontTip.style.display = "none";
      }

      frontId.textContent = padId;
      backId.textContent = padId;
      frontQuestion.textContent = card.q;
      
      setTimeout(() => {
        backAnswer.textContent = card.a;
      }, 150);

      const isStar = starredIds.includes(card.id);
      const isDone = doneIds.includes(card.id);

      frontStatus.textContent = `${isStar ? "⭐ " : ""}${isDone ? "✅" : ""}`;
      starBtn.classList.toggle("active", isStar);
      doneBtn.classList.toggle("active", isDone);

      counterText.textContent = `${currentIndex + 1} / ${filteredCards.length}`;
      progressFill.style.width = `${((currentIndex + 1) / filteredCards.length) * 100}%`;

      if (isListView) {
        renderListView();
      }
    }

    function renderListView() {
      listViewArea.innerHTML = filteredCards.map(c => {
        const padId = "#" + String(c.id).padStart(3, "0");
        const isStar = starredIds.includes(c.id);
        const isDone = doneIds.includes(c.id);
        const examHtml = c.exam ? ` <span style="color:#d97706; font-weight:800;">[${c.exam}]</span>` : "";
        const tipHtml = showTip && c.tip ? ` (💡 ${c.tip})` : "";
        return `
          <div class="list-item">
            <div class="list-item-top">
              <span>${c.cat}${examHtml}${tipHtml}</span>
              <span>${padId}</span>
            </div>
            <div class="list-item-q">Q. ${c.q}</div>
            <div class="list-item-a">A. ${c.a}</div>
            <div class="list-item-actions">
              <button class="mini-btn ${isStar ? 'active-star' : ''}" onclick="toggleListStar(${c.id})">⭐ 북마크</button>
              <button class="mini-btn ${isDone ? 'active-done' : ''}" onclick="toggleListDone(${c.id})">✅ 완료</button>
            </div>
          </div>
        `;
      }).join("");
    }

    window.toggleListStar = function(id) {
      if (starredIds.includes(id)) {
        starredIds = starredIds.filter(i => i !== id);
      } else {
        starredIds.push(id);
      }
      render();
    };

    window.toggleListDone = function(id) {
      if (doneIds.includes(id)) {
        doneIds = doneIds.filter(i => i !== id);
      } else {
        doneIds.push(id);
      }
      render();
    };

    function toggleFlip() {
      if (filteredCards.length === 0) return;
      flashcard.classList.toggle("is-flipped");
    }

    flashcard.addEventListener("click", toggleFlip);
    document.getElementById("flipBtn").addEventListener("click", toggleFlip);

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (filteredCards.length === 0) return;
      currentIndex = (currentIndex - 1 + filteredCards.length) % filteredCards.length;
      practiceInput.value = "";
      render();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      if (filteredCards.length === 0) return;
      currentIndex = (currentIndex + 1) % filteredCards.length;
      practiceInput.value = "";
      render();
    });

    starBtn.addEventListener("click", () => {
      if (filteredCards.length === 0) return;
      const id = filteredCards[currentIndex].id;
      if (starredIds.includes(id)) {
        starredIds = starredIds.filter(i => i !== id);
      } else {
        starredIds.push(id);
      }
      if (currentCat === "STAR") applyFilter(false);
      else render();
    });

    doneBtn.addEventListener("click", () => {
      if (filteredCards.length === 0) return;
      const id = filteredCards[currentIndex].id;
      if (doneIds.includes(id)) {
        doneIds = doneIds.filter(i => i !== id);
      } else {
        doneIds.push(id);
      }
      if (hideDone) applyFilter(false);
      else render();
    });

    document.getElementById("categoryTabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".tab-btn");
      if (!btn) return;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCat = btn.dataset.cat;
      applyFilter(true);
    });

    searchInput.addEventListener("input", () => applyFilter(true));

    hideDoneBtn.addEventListener("click", () => {
      hideDone = !hideDone;
      hideDoneBtn.classList.toggle("active", hideDone);
      applyFilter(true);
    });

    shuffleBtn.addEventListener("click", () => {
      isShuffled = !isShuffled;
      shuffleBtn.classList.toggle("active", isShuffled);
      applyFilter(true);
    });

    tipToggleBtn.addEventListener("click", () => {
      showTip = !showTip;
      updateTipButtonUI();
      render();
    });

    viewModeBtn.addEventListener("click", () => {
      isListView = !isListView;
      viewModeBtn.classList.toggle("active", isListView);
      cardModeArea.style.display = isListView ? "none" : "flex";
      listViewArea.classList.toggle("show", isListView);
      render();
    });

    resetBtn.addEventListener("click", () => {
      if (confirm("학습 기록(완료 및 북마크)을 모두 초기화하시겠습니까?")) {
        starredIds = [];
        doneIds = [];
        localStorage.removeItem("eip_starred_160");
        localStorage.removeItem("eip_done_160");
        applyFilter(true);
      }
    });

    // 직접 입력 모드
    const typingToggleBtn = document.getElementById("typingToggleBtn");
    typingToggleBtn.addEventListener("click", () => {
      practiceBox.classList.toggle("show");
      typingToggleBtn.classList.toggle("active");
      if (practiceBox.classList.contains("show")) practiceInput.focus();
    });

    function checkPracticeAnswer() {
      if (filteredCards.length === 0) return;
      flashcard.classList.add("is-flipped");
    }

    document.getElementById("checkAnswerBtn").addEventListener("click", checkPracticeAnswer);
    practiceInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.stopPropagation();
        checkPracticeAnswer();
      }
    });

    // 다크 모드 (localStorage 연동 저장)
    const themeBtn = document.getElementById("themeBtn");
    const savedTheme = localStorage.getItem("eip_theme") || "light";
    if (savedTheme === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
      themeBtn.textContent = "☀️";
    }

    themeBtn.addEventListener("click", () => {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      const newTheme = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", newTheme);
      localStorage.setItem("eip_theme", newTheme);
      themeBtn.textContent = isDark ? "🌙" : "☀️";
    });

    // 터치 스와이프 제스처 (수직 스크롤 간섭 방지)
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;
    const cardStage = document.getElementById("cardStage");

    cardStage.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    cardStage.addEventListener("touchend", (e) => {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;
      
      if (Math.abs(diffX) > 55 && Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX < 0) document.getElementById("nextBtn").click();
        else document.getElementById("prevBtn").click();
      }
    }, { passive: true });

    // 키보드 단축키
    window.addEventListener("keydown", (e) => {
      if (document.activeElement === searchInput || document.activeElement === practiceInput) return;
      if (e.code === "Space") {
        e.preventDefault();
        toggleFlip();
      } else if (e.code === "ArrowRight") {
        document.getElementById("nextBtn").click();
      } else if (e.code === "ArrowLeft") {
        document.getElementById("prevBtn").click();
      } else if (e.key.toLowerCase() === "s") {
        starBtn.click();
      } else if (e.key.toLowerCase() === "d") {
        doneBtn.click();
      }
    });

    // 초기 렌더링
    applyFilter(true);
  </script>
</body>
</html>
